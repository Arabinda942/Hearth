<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth — your whole phone, one screen</title>
<style>
:root{--bg:#f7f1df;--card:#fffdf6;--ink:#1c1b17;--mute:#7b7566;--acc:#f2b933;--dark:#1d1c19;--darkink:#f4efe1;--line:#e8e0c8;--ok:#3f9b6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--card:#1f1d17;--ink:#f4efe1;--mute:#9a937f;--dark:#f2b933;--darkink:#1c1b17;--line:#33301f}}
:root[data-theme="dark"]{--bg:#15140f;--card:#1f1d17;--ink:#f4efe1;--mute:#9a937f;--dark:#f2b933;--darkink:#1c1b17;--line:#33301f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}.logo i{width:10px;height:10px;border-radius:50%;background:var(--acc)}
nav{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:99px;border:1px solid var(--line);overflow-x:auto;max-width:100%}
nav button{border:0;background:none;color:var(--mute);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--dark);color:var(--darkink)}
h1{font-size:clamp(26px,5vw,38px);font-weight:500;margin:6px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.stats{display:flex;gap:28px;margin:6px 0 20px;flex-wrap:wrap}.stats b{font-size:34px;font-weight:400;display:block;line-height:1}.stats span{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border-radius:24px;padding:18px;border:1px solid var(--line);min-width:0}
.card.dk{background:var(--dark);color:var(--darkink);border-color:transparent}
.card h3{margin:0 0 12px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.dk .row{border-color:#ffffff22}
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk small{color:inherit;opacity:.6}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#1c1b17;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.btn{border:0;background:var(--dark);color:var(--darkink);padding:9px 16px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.btn.ln{background:none;border:1px solid var(--line);color:var(--ink)}
.ic{border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:inherit;font-size:12px;padding:6px 12px;border-radius:99px;text-decoration:none;margin-left:4px}.ic:hover{background:var(--line)}.ic.rm{color:#c0392b}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.mg b{font-size:11px;color:var(--mute);font-weight:500}.mc{border:0;background:var(--bg);border-radius:12px;min-height:54px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.mc em{font-style:normal;font-size:9px;color:var(--acc);min-height:11px}.mc.td{outline:2px solid var(--acc)}.mc.sel{background:var(--dark);color:var(--darkink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:var(--darkink);padding:10px 18px;border-radius:99px;font-size:14px;z-index:99}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;background:var(--line);color:var(--ink);cursor:pointer;border:0;font-family:inherit}
.chip.on{background:var(--acc);color:#1c1b17}
.bar{display:flex;align-items:flex-end;gap:8px;height:110px}.bar div{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;background:var(--acc);border-radius:8px;min-height:3px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}.tools input{max-width:280px}
dialog{border:0;border-radius:24px;padding:22px;width:min(420px,92vw);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
.pos{color:var(--ok)}.empty{color:var(--mute);font-size:14px;padding:10px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{background:var(--bg);border-radius:14px;padding:8px;min-height:90px;font-size:11px}.cal b{display:block;font-size:12px;margin-bottom:4px}.cal .td{outline:2px solid var(--acc)}
.cal span{display:block;background:var(--acc);color:#1c1b17;border-radius:8px;padding:2px 6px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;background:none;cursor:pointer;flex:none;opacity:.8}.cb.on{background:var(--acc);border-color:var(--acc)}
.done{text-decoration:line-through;opacity:.5}
.gt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 10px;cursor:pointer;text-align:center;font:inherit;font-size:14px;font-weight:500;color:var(--ink)}.tile:hover{border-color:var(--acc)}.tile b{display:block;font-size:36px;margin-bottom:6px;font-weight:400}.tile small{display:block;color:var(--mute);font-size:11px;margin-top:2px;font-weight:400}
#gm{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:60;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.gh{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}.gh h2{margin:0;font-size:18px;flex:1;font-weight:500}.gh span{font-size:13px;color:var(--mute)}
.gbody{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}.gi{font-size:16px;text-align:center;min-height:24px}.g3{display:grid;grid-template-columns:repeat(3,92px);gap:8px}
.gc{width:100%;aspect-ratio:1;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:clamp(14px,6vw,28px);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}.gg{display:grid;gap:6px;width:min(100%,380px);touch-action:manipulation}.gbody input{max-width:260px;text-align:center}
canvas.gv{width:min(100%,360px);background:#1d1c19;border-radius:20px;touch-action:none}.gbody .row{justify-content:center}
@media(max-width:640px){.cal{grid-template-columns:1fr}.cal div{min-height:0}}
</style></head><body><div class="wrap">
<header><div class="logo"><i></i>Hearth</div><nav id="nav"></nav></header>
<main id="main"></main></div>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const x=new Date(d);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)},today=()=>iso(new Date());
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function seed(){const t=new Date();return{name:'Arabinda',contacts:[{id:uid(),name:'Sample Contact',phone:'+91 90000 00000',email:'sample@mail.com',group:'Friends',bday:'1998-'+iso(new Date(t.getTime()+6048e5)).slice(5),note:'Delete me'}],tasks:[{id:uid(),title:'Add my real contacts',due:today(),done:false},{id:uid(),title:'Back up Hearth data (Settings)',due:'',done:false}],events:[{id:uid(),title:'Plan the week',date:today(),time:'09:00'}],notes:[{id:uid(),title:'Welcome',type:'Note',body:'Keep notes, document details and reminders here. Avoid storing passwords or card numbers.'}],money:[{id:uid(),title:'Groceries',amount:850,type:'Expense',cat:'Food',date:today()}]}}
let S;try{S=JSON.parse(localStorage.getItem('hearth'))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem('hearth',JSON.stringify(S))}catch(e){}};
let T='overview',Q='',G='All',NF='All',SD=today(),CM=0;
const F={
contacts:['Contact',[['name','Name'],['phone','Phone','tel'],['email','Email','email'],['group','Group',['Family','Friends','Work','Other']],['bday','Birthday','date'],['note','Notes','textarea']]],
tasks:['Task',[['title','Task'],['due','Due date','date']]],
events:['Event',[['title','Title'],['date','Date','date'],['time','Time','time']]],
notes:['Entry',[['title','Title'],['type','Type',['Note','Document','Account','ID','Idea','Medical']],['body','Details','textarea']]],
money:['Entry',[['title','What for'],['amount','Amount (₹)','number'],['type','Type',['Expense','Income']],['cat','Category',['Food','Travel','Bills','Shopping','Health','Salary','Other']],['date','Date','date']]]};
function openForm(k,id){const it=id?S[k].find(x=>x.id==id):{};const[n,f]=F[k];
$('#frm').innerHTML=`<h3 style="margin:0 0 6px;font-size:18px">${id?'Edit':'Add'} ${n.toLowerCase()}</h3>`+f.map(([key,l,t])=>`<label>${l}</label>`+(Array.isArray(t)?`<select name="${key}">${t.map(o=>`<option${it[key]==o?' selected':''}>${o}</option>`).join('')}</select>`:t=='textarea'?`<textarea name="${key}" rows="3">${esc(it[key]||'')}</textarea>`:`<input name="${key}" type="${t||'text'}" value="${esc(it[key]??(t=='date'&&k!='contacts'?(k=='events'?SD:today()):''))}" ${key=='name'||key=='title'?'required':''}>`)).join('')+`<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">${id?`<button type="button" class="btn ln" onclick="del('${k}','${id}',this)" style="margin-right:auto;color:#c0392b">Delete</button>`:''}<button type="button" class="btn ln" onclick="dlg.close()">Cancel</button><button class="btn">Save ${n.toLowerCase()}</button></div>`;
$('#frm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData($('#frm')));if(d.amount!==undefined)d.amount=+d.amount||0;if(id)Object.assign(it,d);else S[k].push({id:uid(),...(k=='tasks'?{done:false}:{}),...d});save();dlg.close();draw()};dlg.showModal()}
const del=(k,id,b)=>{if(b.dataset.s){S[k]=S[k].filter(x=>x.id!=id);save();dlg.close();draw();toast('Deleted');return}b.dataset.s=1;const o=b.textContent;b.textContent='Tap again to confirm';setTimeout(()=>{delete b.dataset.s;b.textContent=o},3000)};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function eraseAll(b){if(b.dataset.s){S={name:S.name,contacts:[],tasks:[],events:[],notes:[],money:[],zones:S.zones};save();draw();return}b.dataset.s=1;b.textContent='Tap again to erase';setTimeout(()=>{delete b.dataset.s;b.textContent='Erase all'},3000)}
const tog=id=>{const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();draw()};
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const ctl=(k,id)=>`<button class="ic" onclick="openForm('${k}','${id}')">Edit</button><button class="ic rm" onclick="del('${k}','${id}',this)">Delete</button>`;
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const taskRow=t=>`<div class="row"><button class="cb ${t.done?'on':''}" onclick="tog('${t.id}')" aria-label="Toggle task"></button><div class="grow ${t.done?'done':''}">${esc(t.title)}<small>${t.due?'Due '+t.due:'No date'}</small></div>${ctl('tasks',t.id)}</div>`;
function nextBday(c){if(!c.bday)return null;const t=new Date();t.setHours(0,0,0,0);const[,m,d]=c.bday.split('-');let n=new Date(t.getFullYear(),m-1,d);if(n<t)n=new Date(t.getFullYear()+1,m-1,d);return Math.round((n-t)/864e5)}
const monthSpend=()=>{const m=today().slice(0,7);return S.money.filter(x=>x.type=='Expense'&&x.date.startsWith(m)).reduce((a,x)=>a+x.amount,0)};
const weekDays=()=>{const t=new Date();t.setDate(t.getDate()-t.getDay());return[...Array(7)].map((_,i)=>{const d=new Date(t);d.setDate(t.getDate()+i);return iso(d)})};
const hr=new Date().getHours();
const V={
overview(){const open=S.tasks.filter(t=>!t.done);const bd=S.contacts.map(c=>({c,n:nextBday(c)})).filter(x=>x.n!==null&&x.n<=30).sort((a,b)=>a.n-b.n);
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return iso(d)});const sp=days.map(d=>S.money.filter(x=>x.type=='Expense'&&x.date==d).reduce((a,x)=>a+x.amount,0));const mx=Math.max(...sp,1);
return`<h1>Good ${hr<12?'morning':hr<17?'afternoon':'evening'}, ${esc(S.name)}</h1><p class="sub">Your whole phone, one screen.</p>
<div class="stats"><div><b>${S.contacts.length}</b><span>People</span></div><div><b>${open.length}</b><span>Open tasks</span></div><div><b>${S.notes.length}</b><span>Vault entries</span></div><div><b>${inr(monthSpend())}</b><span>Spent this month</span></div></div>
<div class="grid"><div class="card dk"><h3>Tasks <span>${open.length} open</span></h3>${S.tasks.slice(0,6).map(t=>`<div class="row"><button class="cb ${t.done?'on':''}" onclick="tog('${t.id}')" aria-label="Toggle task"></button><div class="grow ${t.done?'done':''}">${esc(t.title)}<small>${t.due||'No date'}</small></div></div>`).join('')||'<div class="empty">Nothing to do.</div>'}<button class="btn" style="background:var(--acc);color:#1c1b17;margin-top:10px" onclick="openForm('tasks')">Add task</button></div>
<div class="card"><h3>Spending, last 7 days</h3><div class="bar">${sp.map((v,i)=>`<div><i style="height:${v/mx*80}%"></i>${DAYS[new Date(days[i]).getDay()]}</div>`).join('')}</div></div>
<div class="card"><h3>Upcoming birthdays</h3>${bd.map(x=>`<div class="row"><span class="av">${ini(x.c.name)}</span><div class="grow">${esc(x.c.name)}<small>${x.n==0?'Today':'In '+x.n+' days'}</small></div></div>`).join('')||'<div class="empty">None in the next 30 days.</div>'}</div>
<div class="card"><h3>Today</h3>${S.events.filter(e=>e.date==today()).map(e=>`<div class="row"><div class="grow">${esc(e.title)}<small>${e.time||''}</small></div></div>`).join('')||'<div class="empty">No events today.</div>'}<button class="btn ln" onclick="openForm('events')">Add event</button></div></div>`},
people(){const gs=['All','Family','Friends','Work','Other'];const l=S.contacts.filter(c=>(G=='All'||c.group==G)&&(c.name+c.phone+c.email).toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
return`<h1>People</h1><p class="sub">Contacts, birthdays and notes.</p><div class="tools"><input id="q" placeholder="Search by name, phone or email" value="${esc(Q)}" oninput="Q=this.value;draw(1)"><button class="btn" onclick="openForm('contacts')">Add contact</button></div><div class="tools">${gs.map(g=>`<button class="chip ${G==g?'on':''}" onclick="G='${g}';draw()">${g}${g=='All'?'':' '+S.contacts.filter(c=>c.group==g).length}</button>`).join('')}</div>
<div class="card">${l.map(c=>`<div class="row"><span class="av">${ini(c.name)}</span><div class="grow">${esc(c.name)}<small>${esc([c.phone,c.email,c.group].filter(Boolean).join(' · '))}${c.note?' — '+esc(c.note):''}</small></div>${c.phone?`<a class="ic" href="tel:${esc(c.phone)}">Call</a>`:''}${ctl('contacts',c.id)}</div>`).join('')||'<div class="empty">No contacts match. Add one to get started.</div>'}</div>`},
planner(){const wd=weekDays();return`<h1>Planner</h1><p class="sub">This week and your task list.</p><div class="card" style="margin-bottom:14px"><h3>Week <button class="btn" onclick="openForm('events')">Add event</button></h3><div class="cal">${wd.map(d=>`<div class="${d==today()?'td':''}"><b>${DAYS[new Date(d).getDay()]} ${d.slice(8)}</b>${S.events.filter(e=>e.date==d).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(e=>`<span title="Click to edit" onclick="openForm('events','${e.id}')">${e.time||''} ${esc(e.title)}</span>`).join('')}</div>`).join('')}</div></div>
<div class="card"><h3>Tasks <button class="btn" onclick="openForm('tasks')">Add task</button></h3>${S.tasks.map(taskRow).join('')||'<div class="empty">No tasks yet.</div>'}</div>`},
vault(){const ts=['All','Note','Document','Account','ID','Idea','Medical'];const l=S.notes.filter(n=>(NF=='All'||n.type==NF)&&(n.title+n.body).toLowerCase().includes(Q.toLowerCase()));
return`<h1>Vault</h1><p class="sub">Notes, document details and account info. Stored only in this browser. Keep passwords and card numbers out.</p><div class="tools"><input id="q" placeholder="Search entries" value="${esc(Q)}" oninput="Q=this.value;draw(1)"><button class="btn" onclick="openForm('notes')">Add entry</button></div><div class="tools">${ts.map(t=>`<button class="chip ${NF==t?'on':''}" onclick="NF='${t}';draw()">${t}</button>`).join('')}</div>
<div class="grid">${l.map(n=>`<div class="card"><h3>${esc(n.title)} <span class="chip">${n.type}</span></h3><div style="white-space:pre-wrap;font-size:14px;color:var(--mute)">${esc(n.body)}</div><div style="margin-top:10px">${ctl('notes',n.id)}</div></div>`).join('')||'<div class="empty">Nothing here yet.</div>'}</div>`},
money(){const m=today().slice(0,7),ms=S.money.filter(x=>x.date.startsWith(m)),inc=ms.filter(x=>x.type=='Income').reduce((a,x)=>a+x.amount,0),exp=monthSpend();const cats={};ms.filter(x=>x.type=='Expense').forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.amount);const mx=Math.max(...Object.values(cats),1);
return`<h1>Money</h1><p class="sub">Income and spending for this month.</p><div class="stats"><div><b class="pos">${inr(inc)}</b><span>Income</span></div><div><b>${inr(exp)}</b><span>Spent</span></div><div><b>${inr(inc-exp)}</b><span>Left</span></div></div>
<div class="grid"><div class="card"><h3>By category</h3>${Object.entries(cats).map(([c,v])=>`<div style="margin:8px 0;font-size:13px">${c} <span style="float:right">${inr(v)}</span><div style="background:var(--acc);height:8px;border-radius:9px;width:${v/mx*100}%;margin-top:4px"></div></div>`).join('')||'<div class="empty">No spending this month.</div>'}</div>
<div class="card" style="grid-column:1/-1"><h3>Transactions <button class="btn" onclick="openForm('money')">Add entry</button></h3>${[...S.money].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(x=>`<div class="row"><div class="grow">${esc(x.title)}<small>${x.cat} · ${x.date}</small></div><b class="${x.type=='Income'?'pos':''}">${x.type=='Income'?'+':'−'}${inr(x.amount)}</b>${ctl('money',x.id)}</div>`).join('')||'<div class="empty">No entries yet.</div>'}</div></div>`},
calendar(){const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+CM);const y=b.getFullYear(),m=b.getMonth(),n=new Date(y,m+1,0).getDate(),cells=[...Array(b.getDay())].map(()=>'<i></i>');
for(let d=1;d<=n;d++){const ds=iso(new Date(y,m,d)),c=S.events.filter(e=>e.date==ds).length,bd=S.contacts.some(x=>x.bday&&x.bday.slice(5)==ds.slice(5));cells.push(`<button class="mc ${ds==today()?'td':''} ${ds==SD?'sel':''}" onclick="SD='${ds}';draw()">${d}<em>${'●'.repeat(Math.min(c,3))}${bd?'🎂':''}</em></button>`)}
const ev=S.events.filter(e=>e.date==SD).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),bs=S.contacts.filter(x=>x.bday&&x.bday.slice(5)==SD.slice(5));
return`<h1>Calendar</h1><p class="sub">Tap a date to see or add events.</p><div class="card"><h3><button class="ic" onclick="CM--;draw()">‹ Prev</button>${b.toLocaleString('en',{month:'long',year:'numeric'})}<button class="ic" onclick="CM++;draw()">Next ›</button></h3><div class="mg">${DAYS.map(d=>`<b>${d}</b>`).join('')}${cells.join('')}</div></div><div class="card" style="margin-top:14px"><h3>${new Date(SD+'T00:00').toDateString()} <button class="btn" onclick="openForm('events')">Add event</button></h3>${ev.map(e=>`<div class="row"><div class="grow">${esc(e.title)}<small>${e.time||'All day'}</small></div>${ctl('events',e.id)}</div>`).join('')}${bs.map(x=>`<div class="row"><span class="av">${ini(x.name)}</span><div class="grow">${esc(x.name)}'s birthday</div></div>`).join('')}${ev.length||bs.length?'':'<div class="empty">Nothing planned for this day.</div>'}</div>`},
clock(){S.zones=S.zones||ZD.slice();const opts=ZALL.filter(z=>!S.zones.includes(z));
return`<h1>Clock</h1><p class="sub">World clocks, stopwatch and timer.</p><div class="grid"><div class="card dk"><h3>Local time</h3><div id="lt" style="font-size:44px;font-weight:300">--:--:--</div><small id="ld"></small></div>
<div class="card"><h3>Stopwatch</h3><div id="sw" style="font-size:40px;font-weight:300">00:00.00</div><div class="tools" style="margin:10px 0"><button class="btn" onclick="swGo()">${SW.run?'Pause':'Start'}</button><button class="btn ln" onclick="swLap()">Lap</button><button class="btn ln" onclick="swReset()">Reset</button></div><div id="laps">${lapsHtml()}</div></div>
<div class="card"><h3>Timer</h3><div id="tm" style="font-size:40px;font-weight:300">00:00</div><div class="tools" style="margin:10px 0"><input id="tmin" type="number" min="1" value="5" style="max-width:90px" aria-label="Minutes"><button class="btn" onclick="tmGo()">${TM.run?'Pause':'Start'}</button><button class="btn ln" onclick="tmReset()">Reset</button></div></div></div>
<div class="card" style="margin-top:14px"><h3>World clocks <select onchange="if(this.value){S.zones.push(this.value);save();draw()}" style="max-width:200px"><option value="">Add city…</option>${opts.map(z=>`<option>${z}</option>`).join('')}</select></h3>${S.zones.map(z=>`<div class="row"><div class="grow">${z.split('/').pop().replace(/_/g,' ')}<small>${z}</small></div><b class="zt" data-z="${z}">--</b><button class="ic rm" onclick="S.zones=S.zones.filter(x=>x!='${z}');save();draw()">Remove</button></div>`).join('')}</div>`},
weather(){return`<h1>Weather</h1><p class="sub">Kolkata</p><div class="grid"><div class="card dk"><h3>Now</h3><div style="font-size:56px;font-weight:300">${WX.t}°C</div><small>${WX.c} · ${WX.src}</small><div style="margin-top:12px"><button class="btn" style="background:var(--acc);color:#1c1b17" onclick="liveWx()">Refresh live</button></div></div><div class="card" style="grid-column:1/-1"><h3>8-day forecast</h3>${WX.d.map(d=>`<div class="row"><div class="grow">${d[0]} <small style="display:inline">${d[1]}</small></div><span style="font-size:12px;color:var(--mute)">Rain ${d[4]}%</span><b style="width:44px;text-align:right">${d[2]}°</b><span style="color:var(--mute);width:36px">${d[3]}°</span></div>`).join('')}</div></div>`},
games(){return`<h1>Games</h1><p class="sub">${GM.length} games. Tap one to open it like an app.</p><div class="gt">${GM.map((g,i)=>`<button class="tile" onclick="openGame(${i})"><b>${g.i}</b>${g.n}<small>${BEST[g.n]!=null?'Best '+BEST[g.n]:'Not played yet'}</small></button>`).join('')}</div>`},
settings(){return`<h1>Settings</h1><p class="sub">Your data lives in this browser. Export a backup regularly.</p><div class="grid"><div class="card"><h3>Profile</h3><label>Your name</label><input value="${esc(S.name)}" onchange="S.name=this.value;save()"><label>Theme</label><select onchange="setTheme(this.value)"><option value="">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
<div class="card"><h3>Backup</h3><p class="sub" style="font-size:13px">Export saves a JSON file. Import replaces current data.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exp()">Export backup</button><button class="btn ln" onclick="$('#imp').click()">Import backup</button><button class="btn ln" onclick="eraseAll(this)">Erase all</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div></div>`}};
function setTheme(v){v?document.documentElement.dataset.theme=v:delete document.documentElement.dataset.theme;try{localStorage.setItem('hearth-theme',v)}catch(e){}}
try{const th=localStorage.getItem('hearth-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='hearth-backup-'+today()+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.contacts)throw 0;S=d;save();draw()}catch(e){toast('That file is not a valid Hearth backup.')}};r.readAsText(f)}
